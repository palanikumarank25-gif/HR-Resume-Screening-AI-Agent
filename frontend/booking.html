<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexxora HR | Interview Booking</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<main class="shell-main" style="max-width:900px; margin:2rem auto;">
    <header class="topbar">
        <div>
            <h1>Interview Slot Booking</h1>
            <p class="subtle" id="booking-subtitle">Validating invitation...</p>
        </div>
    </header>

    <section class="card stack" style="margin-bottom:0.8rem;">
        <h3>Campaign Details</h3>
        <div id="campaign-details" class="subtle">Loading...</div>
    </section>

    <section class="card stack">
        <h3>Available Slots</h3>
        <div id="slot-list" class="stack">
            <div class="subtle">Loading slots...</div>
        </div>
        <div id="booking-status" class="hint"></div>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
